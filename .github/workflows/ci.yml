name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

jobs:
  # ── tests ────────────────────────────────────────────────────────
  # Postgres runs as a service so the repo tests actually execute. Without
  # DATABASE_URL reachable they self-skip, which reads as green while testing
  # nothing. Redis is faked in conftest, so no Redis service is needed.
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentforge:agentforge@localhost:5432/agentforge
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Test
        run: uv run pytest -q

  # ── lint ─────────────────────────────────────────────────────────
  # NOT BLOCKING YET. There are 17 pre-existing ruff violations (mostly import
  # ordering and missing trailing newlines) and 41 mypy errors under strict.
  # Flip continue-on-error off once those are swept — a lint gate that has
  # always been red teaches everyone to ignore it.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Ruff
        continue-on-error: true
        run: uv run ruff check src/ tests/

      - name: Mypy
        continue-on-error: true
        run: uv run mypy src/

  # ── images ───────────────────────────────────────────────────────
  # One Dockerfile, three targets sharing every layer below the final stage.
  # Names match infra/helm/.../_helpers.tpl and infra/terraform/ecr.tf.
  images:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      id-token: write          # OIDC for the ECR role assumption below
    strategy:
      fail-fast: false
      matrix:
        component: [api-gateway, worker, migrate]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Push only from main, and only once AWS_ROLE_ARN is configured as a
      # repository variable. Until then this job still proves the image builds.
      - name: Authenticate to AWS
        id: aws
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to ECR
        id: ecr
        if: steps.aws.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build${{ steps.ecr.outcome == 'success' && ' and push' || '' }} ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.component }}
          push: ${{ steps.ecr.outcome == 'success' }}
          # ECR repos are IMMUTABLE, so every push needs a fresh tag: the commit
          # SHA. `latest` would be rejected on the second push of the same tag.
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/agentforge/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
