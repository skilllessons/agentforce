{{- if .Values.externalSecrets.enabled }}
{{- /*
Secrets Manager → the <release>-secrets Secret every pod reads (agentforge.envFrom).
Needs the external-secrets operator in the cluster (Terraform addons.tf); it
authenticates with its own IRSA role, so no credentials appear here.

Both objects are pre-install/pre-upgrade hooks with weights below the migrate
job's (0): the Secret must exist before migrations need DATABASE_URL. The
migrate pod simply waits until the operator has written it.

creationPolicy Orphan: re-creating the ExternalSecret on upgrade must not
garbage-collect the live Secret out from under running pods.
*/}}
{{- $prefix := required "externalSecrets.secretPrefix is required (Terraform local.name, e.g. agentforge-staging-core)" .Values.externalSecrets.secretPrefix }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Release.Name }}-aws-secrets-manager
  labels: {{- include "agentforge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "agentforge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Release.Name }}-aws-secrets-manager
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        ANTHROPIC_API_KEY: {{ `"{{ .anthropic_api_key }}"` }}
        TAVILY_API_KEY: {{ `"{{ .tavily_api_key }}"` }}
        JWT_SECRET: {{ `"{{ .jwt_secret }}"` }}
        API_KEY_SALT: {{ `"{{ .api_key_salt }}"` }}
        WEBHOOK_SIGNING_SECRET: {{ `"{{ .webhook_signing_secret }}"` }}
        {{- if not .Values.postgres.enabled }}
        # RDS sets rds.force_ssl=1 (rds.tf), hence sslmode=require. The master
        # password uses only URL-safe characters (random_password override_special "_-").
        DATABASE_URL: {{ `"postgresql://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:{{ .db_port }}/{{ .db_dbname }}?sslmode=require"` }}
        {{- end }}
        {{- if not .Values.redis.enabled }}
        REDIS_URL: {{ `"{{ .redis_url }}"` }}
        {{- end }}
  data:
    {{- range $key, $property := dict "anthropic_api_key" "ANTHROPIC_API_KEY" "tavily_api_key" "TAVILY_API_KEY" "jwt_secret" "JWT_SECRET" "api_key_salt" "API_KEY_SALT" "webhook_signing_secret" "WEBHOOK_SIGNING_SECRET" }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ $prefix }}/app/runtime, property: {{ $property }} }
    {{- end }}
    {{- if not .Values.postgres.enabled }}
    {{- range $field := list "username" "password" "host" "port" "dbname" }}
    - secretKey: db_{{ $field }}
      remoteRef: { key: {{ $prefix }}/rds/master-password, property: {{ $field }} }
    {{- end }}
    {{- end }}
    {{- if not .Values.redis.enabled }}
    - secretKey: redis_url
      remoteRef: { key: {{ $prefix }}/redis/auth-token, property: url }
    {{- end }}
{{- end }}
