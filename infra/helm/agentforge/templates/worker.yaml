{{- if .Values.worker.enabled }}
{{- /* One Deployment per vertical: `agentforge-worker <vertical>` drains only
       that vertical's Redis queue (platform/worker/main.py). The worker serves
       no port (it blocks in BRPOP), so there are no HTTP probes: a crashed
       process exits and Kubernetes restarts it. */}}
{{- range $vertical := .Values.worker.verticals }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-worker-{{ $vertical }}
  labels: {{- include "agentforge.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: {{ $.Release.Name }}
      agentforge.io/vertical: {{ $vertical }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: {{ $.Release.Name }}
        agentforge.io/vertical: {{ $vertical }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $.Values.podSecurity.runAsUser }}
        fsGroup: {{ $.Values.podSecurity.runAsUser }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: {{ include "agentforge.image" (dict "Values" $.Values "global" $.Values.global "component" "worker") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $vertical | quote }}]
          {{- include "agentforge.envFrom" $ | nindent 10 }}
          resources: {{- toYaml $.Values.worker.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 30"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- if $.Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-worker-{{ $vertical }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-worker-{{ $vertical }}
  minReplicas: {{ $.Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $.Values.worker.autoscaling.targetCPUUtilization }} }
{{- end }}
{{- end }}
{{- end }}
